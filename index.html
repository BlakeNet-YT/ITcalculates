
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 340px;
            padding: 25px;
            border-radius: 25px;
            background: #18212f;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .display {
            width: 100%;
            height: 85px;
            background: #0d1520;
            color: white;
            border: none;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            font-size: 32px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            background: #29374a;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
        }

        .operator {
            background: #ff9500;
            color: white;
        }

        .clear {
            background: #e74c3c;
        }

        .equal {
            background: #16a085;
            grid-column: span 2;
        }

        .zero {
            grid-column: span 2;
        }

        .footer {
            color: #9ba9ba;
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>MY CALCULATOR</h2>

        <input type="text" class="display"
            id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="append('/')">÷</button>
            <button class="operator" onclick="append('*')">×</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('-')">−</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('+')">+</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('.')">.</button>

            <button class="zero" onclick="append('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

        <div class="footer">
            Simple Calculator | Made with HTML, CSS & JavaScript
        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        let expression = "";
        let justCalculated = false;

        function updateDisplay() {
            display.value = expression || "0";
        }

        function append(value) {
            const isOperator = ["+", "-", "*", "/"].includes(value);

            if (justCalculated && !isOperator && value !== ".") {
                expression = "";
            }

            justCalculated = false;

            if (isOperator) {
                if (!expression && value !== "-") return;

                if (/[+\-*/]$/.test(expression)) {
                    expression = expression.slice(0, -1);
                }
            }

            if (value === ".") {
                const currentNumber = expression.split(/[+\-*/]/).pop();
                if (currentNumber.includes(".")) return;
                if (!currentNumber) expression += "0";
            }

            expression += value;
            updateDisplay();
        }

        function clearDisplay() {
            expression = "";
            justCalculated = false;
            updateDisplay();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            justCalculated = false;
            updateDisplay();
        }

        function calculate() {
            if (!expression || /[+\-*/.]$/.test(expression)) return;

            try {
                let position = 0;
                const tokens = expression.match(
                    /(?:\d+\.?\d*|\.\d+)|[+\-*/]/g
                );

                if (!tokens || tokens.join("") !== expression) {
                    throw new Error("Invalid input");
                }

                function factor() {
                    if (tokens[position] === "-") {
                        position++;
                        return -factor();
                    }

                    if (tokens[position] === "+") {
                        position++;
                        return factor();
                    }

                    const number = Number(tokens[position++]);

                    if (!Number.isFinite(number)) {
                        throw new Error("Invalid number");
                    }

                    return number;
                }

                function term() {
                    let result = factor();

                    while (
                        tokens[position] === "*" ||
                        tokens[position] === "/"
                    ) {
                        const operator = tokens[position++];
                        const next = factor();

                        if (operator === "*") {
                            result *= next;
                        } else {
                            if (next === 0) throw new Error("Division by zero");
                            result /= next;
                        }
                    }

                    return result;
                }

                function expressionResult() {
                    let result = term();

                    while (
                        tokens[position] === "+" ||
                        tokens[position] === "-"
                    ) {
                        const operator = tokens[position++];
                        const next = term();

                        result = operator === "+"
                            ? result + next
                            : result - next;
                    }

                    return result;
                }

                const result = expressionResult();

                if (position !== tokens.length || !Number.isFinite(result)) {
                    throw new Error("Invalid calculation");
                }

                expression = String(
                    Number(result.toPrecision(12))
                );

                justCalculated = true;
                updateDisplay();

            } catch (error) {
                display.value = "Error";
                expression = "";
                justCalculated = true;
            }
        }

        document.addEventListener("keydown", function(event) {
            if (/^[0-9.]$/.test(event.key)) {
                append(event.key);
            } else if (["+", "-", "*", "/"].includes(event.key)) {
                append(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                calculate();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (event.key === "Escape") {
                clearDisplay();
            }
        });
    </script>

</body>
</html>
